<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Biblioteca Universitaria del Valle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark site-navbar">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold brand-name" href="{{ url_for('index') }}">Biblioteca Universitaria del Valle</a>
        <ul class="navbar-nav flex-row flex-wrap gap-2 align-items-center">
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'index' %} active{% endif %}" href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'catalogo' %} active{% endif %}" href="{{ url_for('catalogo') }}"{% if request.endpoint == 'catalogo' %} aria-current="page"{% endif %}>Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'servicios' %} active{% endif %}" href="{{ url_for('servicios') }}"{% if request.endpoint == 'servicios' %} aria-current="page"{% endif %}>Servicios</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if request.endpoint == 'contacto' %} active{% endif %}" href="{{ url_for('contacto') }}"{% if request.endpoint == 'contacto' %} aria-current="page"{% endif %}>Contacto</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container-fluid py-4 page-shell">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
          <header class="page-header mb-4">
            <span class="eyebrow">Universidad · Investigación · Aprendizaje</span>
            <h1>{{ titulo }}</h1>
            <p class="lead mb-0">{{ mensaje }}</p>
          </header>
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
  </body>
</html>
